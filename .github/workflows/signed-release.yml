name: Signed Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
      APK_DIR: app/build/outputs/apk/release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Locate unsigned APK
        id: locate
        shell: bash
        run: |
          set -e
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -type f \( -name '*unsigned.apk' -o -name '*-release.apk' \) | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Zipalign APK
        run: |
          set -e
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -f -p 4 "${{ steps.locate.outputs.apk_path }}" "$APK_DIR/AIImageGenerator-release-aligned.apk"

      - name: Sign APK
        run: |
          set -e
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_ALIAS_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_DIR/AIImageGenerator-release-signed.apk" \
            "$APK_DIR/AIImageGenerator-release-aligned.apk"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Verify signed APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify -v "$APK_DIR/AIImageGenerator-release-signed.apk"

      - name: Upload signed APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/AIImageGenerator-release-signed.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIImageGenerator-release-signed
          path: app/build/outputs/apk/release/AIImageGenerator-release-signed.apk
