name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/update when run manually"
        required: false
      release_name:
        description: "Release title when run manually"
        required: false
      release_notes:
        description: "Optional release notes for manual runs"
        required: false

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag_name || format('manual-build-{0}', github.run_number) }}
      RELEASE_NAME: ${{ github.event_name == 'release' && github.event.release.name || inputs.release_name || format('Manual Build {0}', github.run_number) }}
      RELEASE_NOTES: ${{ inputs.release_notes || format('Automated APK build from workflow run {0}.', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename artifact for release
        run: cp app/build/outputs/apk/debug/app-debug.apk AIImageGenerator-debug.apk

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: AIImageGenerator-debug.apk
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIImageGenerator-debug-apk
          path: AIImageGenerator-debug.apk
