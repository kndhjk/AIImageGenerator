name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename artifact for release
        run: cp app/build/outputs/apk/debug/app-debug.apk AIImageGenerator-debug.apk

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AIImageGenerator-debug.apk
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIImageGenerator-debug-apk
          path: AIImageGenerator-debug.apk
